<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox Show</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="headerLogo">
            <img src="img/logo.png" alt="Logo do site Jukebox Show">
        </div>
        <div class="button">
            <button class="glow-on-hover" type="button">Garanta Seu Ingresso!</button>
        </div>
    </header>

    <section class="home">
        <div>
            <h1> Maior encontro de DJs do litoral gaucho! </h1>
            <br>
            <p>
                Prepare-se para uma noite inesquecível de música eletrônica! O Jukebox Show reúne grandes DJs em
                Tramandaí para uma experiência única à beira-mar, com muita energia, luzes e batidas que vão fazer a
                pista vibrar
                até o amanhecer.
            </p>
            <br>
            <div class="btn2"><button>VER MAIS</button></div>
        </div>
        <div>
            <img src="img/banner.png" alt="">
        </div>
    </section>

    <section class="galeria">
        <h2>Venha ver nossas atrações:</h2>
        <br>
        <div class="fotos">
            <img src="img/img1.webp" alt="" class="img1">
            <img src="img/img3.jpeg" alt="" class="img2">
            <img src="img/img4.webp" alt="" class="img3">
            <img src="img/img5.jpg" alt="" class="img4">
            <img src="img/img6.webp" alt="" class="img5">
            <img src="img/img7.jpeg" alt="" class="img6">
            <img src="img/img2.avif" alt="" class="img7">
            <img src="img/img8.avif" alt="" class="img8">
            <img src="img/img9.avif" alt="" class="img9">
        </div>
    </section>

        

</body>

</html>
